[package]
name = "pulse-forum"
version = "0.2.6"
edition = "2021"
description = "Collector for the PULSE Forum 2026 story draw: entries in, admin draw and Excel export out"
publish = false

[dependencies]
axum = "0.7"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
zip = { version = "9.0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
